name: Apply v0.4.2 Attention Labels

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-v042.yml'

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply source patch
        run: python3 tools/apply_v042_patch.py

      - name: Build v0.4.2 APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK and clean migration files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AI-no-kimochi-v0.4.2-debug.apk
          rm -f tools/apply_v042_patch.py .github/workflows/apply-v042.yml

      - name: Commit v0.4.2 source and APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: label Attention connections v0.4.2 [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-no-kimochi-v0.4.2-debug
          path: dist/AI-no-kimochi-v0.4.2-debug.apk
          if-no-files-found: error

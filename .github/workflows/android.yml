name: Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply pending v0.4.2 source patch
        run: |
          if [ -f tools/apply_v042_patch.py ]; then
            python3 tools/apply_v042_patch.py
          fi

      - name: Build debug APK
        id: android_build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee android-build.log

      - name: Prepare APK
        if: steps.android_build.outcome == 'success'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AI-no-kimochi-v0.4.2-debug.apk

      - name: Upload APK artifact
        if: steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AI-no-kimochi-v0.4.2-debug
          path: dist/AI-no-kimochi-v0.4.2-debug.apk
          if-no-files-found: error

      - name: Commit migrated source to PR branch
        if: steps.android_build.outcome == 'success' && github.event_name == 'pull_request'
        run: |
          if [ ! -f tools/apply_v042_patch.py ]; then
            echo "No migration script"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aikimochi/app/AiNoKimochiActivityV41.kt app/build.gradle.kts README.md
          if git diff --cached --quiet; then
            echo "Migration already present"
          else
            git commit -m "feat: label Attention connections v0.4.2 [skip ci]"
            git pull --rebase origin "${{ github.head_ref }}"
            git push origin HEAD:"${{ github.head_ref }}"
          fi

      - name: Fail workflow when build failed
        if: steps.android_build.outcome == 'failure'
        run: exit 1

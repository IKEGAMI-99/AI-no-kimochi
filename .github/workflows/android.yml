name: Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: android_build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee android-build.log

      - name: Publish build error log
        if: steps.android_build.outcome == 'failure' && github.event_name == 'push'
        run: |
          mkdir -p dist
          cp android-build.log dist/build-error-v0.3.1.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/build-error-v0.3.1.txt
          git commit -m "ci: publish v0.3.1 build error [skip ci]" || true
          git pull --rebase origin main
          git push

      - name: Prepare direct-download APK
        if: steps.android_build.outcome == 'success'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AI-no-kimochi-v0.3.1-debug.apk
          rm -f dist/build-error-v0.3.1.txt

      - name: Upload APK artifact
        if: steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AI-no-kimochi-v0.3.1-debug
          path: dist/AI-no-kimochi-v0.3.1-debug.apk
          if-no-files-found: error

      - name: Publish APK to repository
        if: steps.android_build.outcome == 'success' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/AI-no-kimochi-v0.3.1-debug.apk dist/build-error-v0.3.1.txt || true
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "build: publish v0.3.1 debug APK [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Fail workflow when build failed
        if: steps.android_build.outcome == 'failure'
        run: exit 1
